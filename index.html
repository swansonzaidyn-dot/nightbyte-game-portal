<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nightbyte — Game Library</title>
<meta name="description" content="A polished browser game library demo with original mini-games.">
<style>
:root{
  --bg:#090a0c;--panel:#111216;--panel2:#17181d;--line:#292b31;--text:#f5f5f5;
  --muted:#9a9da7;--accent:#8ce66b;--accent2:#5bd1ff;--danger:#ff6b6b;
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.poly{position:absolute;width:120px;height:120px;background:linear-gradient(135deg,#2b2d32,#121318);clip-path:polygon(20% 5%,82% 14%,100% 57%,65% 100%,14% 78%,0 30%);opacity:.55;filter:blur(.2px)}
.p1{left:-25px;top:18%}.p2{right:5%;top:9%;width:150px;height:150px}.p3{left:22%;top:44%;width:75px;height:75px}.p4{right:-25px;top:65%;width:170px;height:170px}.p5{left:7%;bottom:6%;width:90px;height:90px}.p6{right:28%;bottom:4%;width:110px;height:110px}
.app{position:relative;z-index:1}
header{height:58px;border-bottom:1px solid #202126;background:rgba(10,10,12,.84);backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 22px;gap:24px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,#20242b,#0a0b0d);border:1px solid #34363d;display:grid;place-items:center;font-size:12px}
nav{display:flex;gap:6px;align-items:center;flex:1}
nav button{background:none;border:0;color:#9c9fa7;padding:9px 12px;border-radius:10px;font-size:13px}
nav button.active,nav button:hover{background:#25262c;color:#fff}
.header-right{display:flex;align-items:center;gap:8px}
.version{font-size:11px;color:#777b84;border:1px solid #2b2d33;padding:6px 9px;border-radius:8px}
.icon-btn{width:34px;height:34px;border:1px solid #2b2d33;background:#15161a;color:#ddd;border-radius:10px}
main{max-width:1180px;margin:0 auto;padding:28px 22px 70px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:28px}
.search{flex:1;position:relative}.search input{width:100%;background:#16171b;border:1px solid #30323a;border-radius:18px;color:#fff;padding:13px 18px 13px 42px;outline:none}.search input:focus{border-color:#4c505a}
.search span{position:absolute;left:16px;top:11px;color:#8d919b}
.pill{border:1px solid #30323a;background:#17181c;color:#ddd;padding:11px 16px;border-radius:16px}
.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:22px;background:linear-gradient(110deg,#0d2616,#0d1410);border:1px solid #21452b;border-radius:22px;padding:28px;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:280px;height:280px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(circle,#75d75a22,transparent 65%)}
.kicker{color:#9ce986;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-size:40px;margin:8px 0 8px;letter-spacing:-1.5px}.hero p{color:#b6b9be;max-width:620px;line-height:1.5}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.primary{border:0;background:#8fe76b;color:#0a1109;font-weight:800;padding:12px 17px;border-radius:15px}.secondary{border:1px solid #3b4041;background:#151b17;color:#ddd;padding:12px 17px;border-radius:15px}
.hero-art{min-height:180px;border-radius:18px;border:1px solid #23482e;background:radial-gradient(circle at 55% 38%,#7ce35d33,transparent 30%),#0b1b10;display:grid;place-items:center;position:relative}
.cube{width:82px;height:82px;transform:rotate(30deg) skewY(-8deg);background:linear-gradient(135deg,#8ce66b,#2f7542);box-shadow:25px 25px 0 #173820}
.section{margin-top:34px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section h2{font-size:21px;margin:0}.sub{font-size:12px;color:#7f828a;margin-top:4px}.see{color:#9b9da5;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{background:#111216;border:1px solid #25272d;border-radius:15px;overflow:hidden;transition:.18s transform,.18s border-color;position:relative}
.card:hover{transform:translateY(-3px);border-color:#4a4d56}.thumb{aspect-ratio:1/1;background:#181a20;position:relative;display:grid;place-items:center;overflow:hidden}.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,#000b 100%)}
.thumb .shape{width:58%;height:58%;border-radius:24%;transform:rotate(12deg);background:linear-gradient(135deg,#65d9ff,#6d6df7);box-shadow:18px 15px 0 #27275e}
.card:nth-child(2n) .shape{background:linear-gradient(135deg,#ff9f6e,#e14f7e);box-shadow:18px 15px 0 #5c2034}
.card:nth-child(3n) .shape{background:linear-gradient(135deg,#f5e66b,#4fd18d);box-shadow:18px 15px 0 #235c45}
.card:nth-child(4n) .shape{border-radius:50%;transform:none}
.card:nth-child(5n) .shape{background:linear-gradient(135deg,#b38cff,#4e8cff);box-shadow:18px 15px 0 #2b356f}
.meta{position:absolute;left:8px;right:8px;bottom:7px;display:flex;justify-content:space-between;font-size:10px;color:#f3f3f3;z-index:2}.name{padding:10px 10px 11px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:5px;padding:0 10px 10px}.tag{font-size:9px;color:#9fa2aa;border:1px solid #292b31;padding:3px 6px;border-radius:8px}
.empty{padding:35px;text-align:center;color:#858891;border:1px dashed #30323a;border-radius:16px;grid-column:1/-1}
footer{border-top:1px solid #202126;padding:30px 22px;color:#777b83;display:flex;justify-content:space-between;max-width:1180px;margin:auto;font-size:12px}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.show{display:flex}.modalbox{width:min(720px,100%);background:#111216;border:1px solid #34363d;border-radius:18px;box-shadow:0 30px 100px #000;overflow:hidden}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #282a30}.modalbody{padding:18px}.close{border:0;background:none;color:#999;font-size:24px}.gamecanvas{width:100%;aspect-ratio:16/9;background:#07090d;border-radius:13px;border:1px solid #292c35;display:block}.gamecontrols{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.help{color:#9699a2;font-size:12px;line-height:1.5}
.account{width:min(390px,100%)}.field{margin:10px 0}.field label{font-size:11px;color:#9b9ea7;display:block;margin-bottom:5px}.field input{width:100%;background:#1b1c21;border:1px solid #34363d;border-radius:10px;color:#fff;padding:11px;outline:none}.toast{position:fixed;right:18px;bottom:18px;background:#17181d;border:1px solid #34363d;padding:11px 14px;border-radius:12px;display:none;z-index:70;font-size:12px}.toast.show{display:block}
@media(max-width:800px){header{padding:0 12px;gap:10px}nav{display:none}main{padding:18px 14px 55px}.hero{grid-template-columns:1fr;padding:21px}.hero h1{font-size:31px}.hero-art{min-height:135px}.grid{grid-template-columns:repeat(3,1fr);gap:9px}.name{font-size:11px}.tags{display:none}.topbar{margin-bottom:18px}.version{display:none}footer{margin:0 14px;gap:15px;flex-wrap:wrap}}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}.search input{padding-left:37px}.pill{padding:10px 12px}.hero p{font-size:13px}}
</style>
</head>
<body>
<div class="bg"><i class="poly p1"></i><i class="poly p2"></i><i class="poly p3"></i><i class="poly p4"></i><i class="poly p5"></i><i class="poly p6"></i></div>
<div class="app">
<header>
  <div class="brand"><div class="logo">N</div> Nightbyte</div>
  <nav id="nav"><button class="active" data-page="home">Home</button><button data-page="library">Library</button><button data-page="browser">Browser</button><button data-page="about">About</button><button data-page="admin" id="adminNav" style="display:none">Admin</button></nav>
  <div class="header-right"><span class="version">v1.0 demo</span><button class="icon-btn" id="accountBtn" title="Account">◯</button></div>
</header>

<main id="main"></main>

<footer><div>◈ Nightbyte — original demo portal</div><div>Library &nbsp; Browser &nbsp; About &nbsp; Privacy</div></footer>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const games=[
 {id:"neon-dash",name:"Neon Dash",plays:"12.4k",likes:"842",tag:"Arcade",type:"dodge"},
 {id:"block-drop",name:"Block Drop",plays:"9.8k",likes:"611",tag:"Puzzle",type:"blocks"},
 {id:"star-hop",name:"Star Hop",plays:"8.7k",likes:"503",tag:"Arcade",type:"hop"},
 {id:"pixel-garden",name:"Pixel Garden",plays:"7.4k",likes:"477",tag:"Casual",type:"garden"},
 {id:"orbital",name:"Orbital",plays:"6.9k",likes:"420",tag:"Skill",type:"orb"},
 {id:"color-flip",name:"Color Flip",plays:"6.2k",likes:"390",tag:"Puzzle",type:"flip"},
 {id:"tiny-racer",name:"Tiny Racer",plays:"5.7k",likes:"355",tag:"Racing",type:"race"},
 {id:"sky-catch",name:"Sky Catch",plays:"5.2k",likes:"319",tag:"Arcade",type:"catch"},
 {id:"maze-light",name:"Maze Light",plays:"4.8k",likes:"288",tag:"Puzzle",type:"maze"},
 {id:"shape-stack",name:"Shape Stack",plays:"4.3k",likes:"241",tag:"Skill",type:"stack"},
 {id:"gravity-hop",name:"Gravity Hop",plays:"3.9k",likes:"226",tag:"Arcade",type:"hop"},
 {id:"meteor-run",name:"Meteor Run",plays:"3.4k",likes:"198",tag:"Arcade",type:"dodge"},
 {id:"dots",name:"Dots",plays:"3.0k",likes:"176",tag:"Puzzle",type:"blocks"},
 {id:"light-grid",name:"Light Grid",plays:"2.7k",likes:"163",tag:"Puzzle",type:"grid"},
 {id:"orbit-shot",name:"Orbit Shot",plays:"2.3k",likes:"141",tag:"Skill",type:"orb"},
];
const state={favorites:JSON.parse(localStorage.getItem("nb_favs")||"[]"),history:JSON.parse(localStorage.getItem("nb_history")||"[]")};
const main=document.getElementById("main"),modal=document.getElementById("modal"),toast=document.getElementById("toast");
function save(){localStorage.setItem("nb_favs",JSON.stringify(state.favorites));localStorage.setItem("nb_history",JSON.stringify(state.history))}
function notify(t){toast.textContent=t;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1700)}
function card(g){const fav=state.favorites.includes(g.id);return `<article class="card" onclick="openGame('${g.id}')"><div class="thumb"><div class="shape"></div><div class="meta"><span>◉ ${g.plays}</span><span>♡ ${g.likes}</span></div></div><div class="name">${g.name}</div><div class="tags"><span class="tag">${g.tag}</span><span class="tag">${fav?"♥ saved":"♡"}</span></div></article>`}
function grid(list){return `<div class="grid">${list.length?list.map(card).join(""):'<div class="empty">No games matched your search.</div>'}</div>`}
function renderHome(){
main.innerHTML=`<div class="topbar"><div class="search"><span>⌕</span><input id="search" placeholder="Search the library..." oninput="filterHome(this.value)"></div><button class="pill" onclick="shuffle()">Shuffle</button></div>
<section class="hero"><div><div class="kicker">New · Featured</div><h1>Neon Dash</h1><p>A tiny original arcade game built directly into this demo. Dodge the falling blocks, survive as long as you can, and chase your best score.</p><div class="hero-actions"><button class="primary" onclick="openGame('neon-dash')">Play Neon Dash ▷</button><button class="secondary" onclick="go('library')">Open library ↗</button></div></div><div class="hero-art"><div class="cube"></div></div></section>
<section class="section"><div class="section-head"><div><h2>Popular right now</h2><div class="sub">Original demo games</div></div><span class="see" onclick="go('library')">See all →</span></div>${grid(games.slice(0,10))}</section>
<section class="section"><div class="section-head"><div><h2>Recently played</h2><div class="sub">Saved on this device</div></div></div>${grid(state.history.map(id=>games.find(g=>g.id===id)).filter(Boolean).slice(0,5))}</section>`;
}
function renderLibrary(query=""){const list=games.filter(g=>(g.name+" "+g.tag).toLowerCase().includes(query.toLowerCase()));main.innerHTML=`<div class="topbar"><div class="search"><span>⌕</span><input id="search" value="${query.replaceAll('"','&quot;')}" placeholder="Search library..." oninput="renderLibrary(this.value)"></div><button class="pill" onclick="shuffle()">Shuffle</button></div><section><div class="section-head"><div><h1 style="margin:0">Library</h1><div class="sub">Everything in one place</div></div></div>${grid(list)}</section>`}
function renderBrowser(){main.innerHTML=`<div style="min-height:70vh;display:grid;place-items:center;text-align:center"><div style="width:min(720px,100%)"><div class="logo" style="margin:auto;width:54px;height:54px;font-size:18px">N</div><h1 style="font-size:42px;margin:14px 0 4px">Night Browser</h1><p style="color:#8d919a">Open a normal web workspace.</p><div class="search" style="margin:24px 0"><span>⌕</span><input id="url" placeholder="Search or enter a web address" onkeydown="if(event.key==='Enter')goWeb(this.value)"></div><div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">${["Google","Wikipedia","YouTube","Discord","Reddit"].map(x=>`<button class="pill" onclick="goWeb('${x}')">${x}</button>`).join("")}</div><p class="help" style="margin-top:22px">This is a normal navigation helper, not a proxy or network-filter bypass.</p></div></div>`}
function renderAbout(){main.innerHTML=`<section style="max-width:760px"><h1>About Nightbyte</h1><p style="color:#a0a3ac;line-height:1.7">Nightbyte is a frontend demo inspired by the layout patterns in the screenshots you provided: compact navigation, a dark game library, dense game cards, search, shuffle, accounts, and an embedded game experience.</p><h2>What's real in this V1?</h2><p style="color:#a0a3ac;line-height:1.7">The library, search, shuffle, favorites, play history, responsive UI, account modal, and mini-games work in your browser. Data is stored locally on this device for the demo.</p><h2>What's next?</h2><p style="color:#a0a3ac;line-height:1.7">A production version can replace local storage with a real database/auth system and connect an admin game manager. Only games you have permission to distribute or embed should be added.</p></section>`}
async function renderAdmin(){await loadMe();if(!currentUser||currentUser.role!=='admin'){main.innerHTML='<div class="empty">Admin access required. Sign in with an administrator account.</div>';return}main.innerHTML=`<section><div class="section-head"><div><h1>Admin Dashboard</h1><div class="sub">Manage games, users and activity</div></div><button class="primary" onclick="adminAddGame()">+ Add game</button></div><div id="adminStats" class="grid" style="margin-bottom:20px"></div><div class="section-head"><div><h2>Games</h2></div><button class="pill" onclick="renderAdmin()">Refresh</button></div><div id="adminGames"></div><div class="section" id="adminEvents"></div></section>`;try{const [st,gs,ev]=await Promise.all([api('/api/admin/stats'),api('/api/admin/games'),api('/api/admin/play-events')]);document.getElementById('adminStats').innerHTML=[['Users',st.users],['Games',st.games],['Published',st.published],['Total plays',st.plays],['Ratings',st.ratings]].map(x=>`<div class="card" style="padding:18px"><div class="sub">${x[0]}</div><div style="font-size:26px;font-weight:800;margin-top:4px">${x[1]}</div></div>`).join('');document.getElementById('adminGames').innerHTML=`<div style="display:grid;gap:8px">${gs.games.map(g=>`<div class="card" style="padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px"><div><b>${g.title}</b><div class="sub">${g.category} · ${g.plays} plays · ${g.published?'Published':'Hidden'}</div></div><div><button class="pill" onclick='adminEditGame(${JSON.stringify(g)})'>Edit</button> <button class="pill" onclick="adminDeleteGame(${g.id})">Delete</button></div></div>`).join('')}</div>`;document.getElementById('adminEvents').innerHTML='<h2>Recent plays</h2>'+ev.events.slice(0,15).map(e=>`<div class="help" style="padding:7px 0;border-bottom:1px solid #22252b">${e.title} · ${e.email||'guest'} · ${e.created_at}</div>`).join('')}catch(e){document.getElementById('adminGames').innerHTML='<div class="empty">'+e.message+'</div>'}}
function adminAddGame(){modal.innerHTML=`<div class="modalbox"><div class="modalhead"><b>Add game</b><button class="close" onclick="closeModal()">×</button></div><div class="modalbody"><div class="field"><label>Slug</label><input id="gSlug" placeholder="my-game"></div><div class="field"><label>Title</label><input id="gTitle" placeholder="My Game"></div><div class="field"><label>Category</label><input id="gCat" value="Arcade"></div><div class="field"><label>Description</label><input id="gDesc" placeholder="Game description"></div><div class="field"><label>Game URL (authorized content only)</label><input id="gUrl" placeholder="https://example.com/game"></div><button class="primary" style="width:100%" onclick="adminSaveNew()">Create</button></div></div>`;modal.classList.add('show')}
async function adminSaveNew(){try{await api('/api/admin/games',{method:'POST',body:JSON.stringify({slug:gSlug.value,title:gTitle.value,category:gCat.value,description:gDesc.value,game_url:gUrl.value})});closeModal();notify('Game created');renderAdmin()}catch(e){notify(e.message)}}
function adminEditGame(g){modal.innerHTML=`<div class="modalbox"><div class="modalhead"><b>Edit ${g.title}</b><button class="close" onclick="closeModal()">×</button></div><div class="modalbody"><div class="field"><label>Title</label><input id="eTitle" value="${g.title.replaceAll('"','&quot;')}"></div><div class="field"><label>Category</label><input id="eCat" value="${g.category}"></div><div class="field"><label>Description</label><input id="eDesc" value="${(g.description||'').replaceAll('"','&quot;')}"></div><div class="field"><label>Game URL</label><input id="eUrl" value="${(g.game_url||'').replaceAll('"','&quot;')}"></div><label class="help"><input id="ePub" type="checkbox" ${g.published?'checked':''}> Published</label><button class="primary" style="width:100%;margin-top:14px" onclick="adminSaveEdit(${g.id})">Save</button></div></div>`;modal.classList.add('show')}
async function adminSaveEdit(id){try{await api('/api/admin/games/'+id,{method:'PATCH',body:JSON.stringify({title:eTitle.value,category:eCat.value,description:eDesc.value,game_url:eUrl.value,published:ePub.checked})});closeModal();notify('Game updated');renderAdmin()}catch(e){notify(e.message)}}
async function adminDeleteGame(id){if(!confirm('Delete this game?'))return;try{await api('/api/admin/games/'+id,{method:'DELETE'});notify('Game deleted');renderAdmin()}catch(e){notify(e.message)}}
function filterHome(q){const s=document.querySelector(".section");if(s){const sections=document.querySelectorAll(".section");if(sections[0])sections[0].querySelector(".grid").outerHTML=grid(games.filter(g=>(g.name+" "+g.tag).toLowerCase().includes(q.toLowerCase())))}}
function shuffle(){const g=games[Math.floor(Math.random()*games.length)];openGame(g.id)}
function go(page){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));page==="home"?renderHome():page==="library"?renderLibrary():page==="browser"?renderBrowser():page==="admin"?renderAdmin():renderAbout()}
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.page)}
function closeModal(){modal.classList.remove("show");modal.innerHTML='<div class="modalbox" id="modalbox"></div>'}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()})
let currentUser=null;
async function loadMe(){try{const d=await api('/api/auth/me');currentUser=d.user;document.getElementById('adminNav').style.display=currentUser.role==='admin'?'block':'none';}catch{currentUser=null;document.getElementById('adminNav').style.display='none';}}
async function openAccount(){await loadMe();if(currentUser){modal.innerHTML=`<div class="modalbox account"><div class="modalhead"><b>Account</b><button class="close" onclick="closeModal()">×</button></div><div class="modalbody"><p><b>${currentUser.email}</b></p><p class="help">Role: ${currentUser.role}<br>Created: ${currentUser.created_at||'—'}</p><button class="secondary" style="width:100%;margin-top:8px" onclick="go('library');closeModal()">Open Library</button><button class="primary" style="width:100%;margin-top:8px" onclick="logout()">Sign out</button></div></div>`;modal.classList.add('show');return}
modal.innerHTML=`<div class="modalbox account"><div class="modalhead"><b>Sign in</b><button class="close" onclick="closeModal()">×</button></div><div class="modalbody"><div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="authPassword" type="password" placeholder="8+ characters"></div><div id="authErr" class="help" style="color:#ff8b8b"></div><button class="primary" style="width:100%;margin-top:8px" onclick="login()">Sign in</button><button class="secondary" style="width:100%;margin-top:8px" onclick="register()">Create account</button><p class="help" style="text-align:center;margin-top:12px">Accounts sync favorites and ratings through the backend.</p></div></div>`;modal.classList.add('show')}
async function login(){const email=document.getElementById('authEmail').value,password=document.getElementById('authPassword').value;try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});currentUser=d.user;closeModal();notify('Signed in');loadMe();}catch(e){document.getElementById('authErr').textContent=e.message}}
async function register(){const email=document.getElementById('authEmail').value,password=document.getElementById('authPassword').value;try{const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({email,password})});currentUser=d.user;closeModal();notify('Account created');loadMe();}catch(e){document.getElementById('authErr').textContent=e.message}}
async function logout(){try{await api('/api/auth/logout',{method:'POST'});currentUser=null;loadMe();closeModal();notify('Signed out')}catch(e){notify(e.message)}}
document.getElementById("accountBtn").onclick=openAccount;
function openGame(id){const g=games.find(x=>x.id===id);if(!g)return;if(!state.history.includes(id))state.history.unshift(id);state.history=state.history.slice(0,10);save();modal.innerHTML=`<div class="modalbox"><div class="modalhead"><div><b>${g.name}</b><div class="help">${g.tag} · ${g.plays} plays</div></div><button class="close" onclick="closeModal()">×</button></div><div class="modalbody"><canvas class="gamecanvas" id="gameCanvas" width="960" height="540"></canvas><div class="gamecontrols"><button class="primary" onclick="restartGame('${g.type}')">Restart</button><button class="secondary" onclick="toggleFav('${g.id}')">${state.favorites.includes(g.id)?"♥ Saved":"♡ Favorite"}</button></div><p class="help" id="gameHelp">Original mini-game. Use touch/click or keyboard depending on the game.</p></div></div>`;modal.classList.add("show");startGame(g.type)}
async function loadGameRating(id){const el=document.getElementById('gameHelp');if(!el)return;try{const d=await api('/api/games/'+id+'/my-rating');el.innerHTML='Your rating: '+(d.rating||0)+' / 5 · <button class="pill" onclick="rateGame('+id+',5)">Rate 5</button> <button class="pill" onclick="rateGame('+id+',4)">4</button> <button class="pill" onclick="rateGame('+id+',3)">3</button>'}catch{el.textContent='Sign in to save favorites and ratings. Guests can still play.'}}
async function rateGame(id,r){try{await api('/api/games/'+id+'/rating',{method:'POST',body:JSON.stringify({rating:r})});notify('Rating saved')}catch(e){notify(e.message)}}
function toggleFav(id){const i=state.favorites.indexOf(id);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(id);save();notify(i>=0?"Removed from favorites":"Added to favorites");openGame(id)}
let stopGame=()=>{};
function restartGame(type){stopGame();startGame(type)}
function startGame(type){
 const c=document.getElementById("gameCanvas"),x=c.getContext("2d"),W=c.width,H=c.height;let raf=0,alive=true,score=0,t=0;
 const keys={};let px=W/2,py=H-80,vx=0,vy=0,blocks=[];
 function bg(){x.fillStyle="#07090d";x.fillRect(0,0,W,H);for(let i=0;i<40;i++){x.fillStyle=`rgba(120,160,220,${(i%4)/30})`;x.fillRect((i*83)%W,(i*47+t*.2)%H,2,2)}}
 function text(s,a,b,size=24){x.fillStyle="#fff";x.font=`700 ${size}px system-ui`;x.textAlign="center";x.fillText(s,a,b)}
 function loop(){if(!alive)return; t++;bg();
   if(type==="dodge"){if(keys.ArrowLeft||keys.a)px-=7;if(keys.ArrowRight||keys.d)px+=7;px=Math.max(24,Math.min(W-24,px));if(t%26===0)blocks.push({x:20+Math.random()*(W-40),y:-20,s:18+Math.random()*28,v:3+Math.random()*4});blocks.forEach(b=>b.y+=b.v);blocks=blocks.filter(b=>b.y<H+50);x.fillStyle="#8ce66b";x.fillRect(px-22,py-14,44,28);x.fillStyle="#ff5f6d";blocks.forEach(b=>{x.fillRect(b.x-b.s/2,b.y-b.s/2,b.s,b.s);if(Math.abs(px-b.x)<b.s/2+22&&Math.abs(py-b.y)<b.s/2+14)alive=false});score=Math.floor(t/6);text(`Score ${score}`,90,42,22);if(!alive)text("Game over — tap Restart",W/2,H/2,30);
   } else if(type==="blocks"){let bx=W/2-90,by=H/2-45;for(let i=0;i<3;i++){for(let j=0;j<3;j++){x.fillStyle=["#61d6ff","#8ce66b","#ff9c6c"][(i+j)%3];x.fillRect(bx+j*62,by+i*62,50,50)}}text("BLOCK DROP",W/2,70,28);text("Tap Restart to replay",W/2,H-55,18);
   } else if(type==="hop"){vy+=.45;py+=vy;if(py>H-65){py=H-65;vy=-11}x.fillStyle="#f3df69";x.beginPath();x.arc(px,py,24,0,Math.PI*2);x.fill();x.fillStyle="#64d8ff";x.fillRect(0,H-25,W,25);text("TAP / SPACE TO HOP",W/2,65,25);score=Math.floor(t/8);text(score,W-70,42,24);
   } else {x.fillStyle="#67e0a3";x.beginPath();x.arc(W/2,H/2,80+Math.sin(t/20)*12,0,Math.PI*2);x.fill();text(gName(type),W/2,70,28);text("Original demo",W/2,H-55,18)}
   raf=requestAnimationFrame(loop)}
 function gName(z){return ({garden:"PIXEL GARDEN",orb:"ORBITAL",flip:"COLOR FLIP",race:"TINY RACER",catch:"SKY CATCH",maze:"MAZE LIGHT",stack:"SHAPE STACK",grid:"LIGHT GRID"})[z]||"MINI GAME"}
 function input(e){if(e.type==="keydown"){keys[e.key]=true;if(e.code==="Space"&&type==="hop")vy=-11}if(e.type==="keyup")keys[e.key]=false;if(e.type==="pointerdown"&&type==="hop")vy=-11}
 window.addEventListener("keydown",input);window.addEventListener("keyup",input);c.addEventListener("pointerdown",input);stopGame=()=>{alive=false;cancelAnimationFrame(raf);window.removeEventListener("keydown",input);window.removeEventListener("keyup",input);c.removeEventListener("pointerdown",input)};loop()
}
function goWeb(v){let q=v.trim();if(!q)return;let url=/^https?:\/\//i.test(q)?q:"https://www.google.com/search?q="+encodeURIComponent(q);window.open(url,"_blank","noopener")}
renderHome();
</script>
</body>
</html>
